<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | عيادة د. رامي الحسين</title>
  <style>
    :root {
      --bg-dark: #070e1b;
      --card-bg: #0f1d33;
      --accent-gold: #f59e0b;
      --accent-gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding: 24px 14px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    .card { 
      background: var(--card-bg); 
      border: 1px solid rgba(255,255,255,0.08); 
      border-radius: var(--radius); 
      padding: 20px; 
      margin-bottom: 16px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    h1 { font-size: 1.35rem; color: var(--accent-gold); margin-bottom: 6px; text-align: center; font-weight: 800; }
    p.desc { font-size: 0.82rem; color: var(--text-muted); text-align: center; margin-bottom: 18px; }
    
    label { display: block; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
    
    input[type="password"] {
      width: 100%; 
      background: #070e1b; 
      border: 1px solid rgba(255,255,255,0.15); 
      color: #fff; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 0.95rem; 
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: 3px;
    }

    input[type="text"] { 
      width: 100%;
      padding: 12px; 
      background: #070e1b; 
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    input:focus { border-color: var(--accent-gold); outline: none; }

    .help-link {
      display: inline-block;
      margin-bottom: 12px;
      color: #38bdf8;
      font-size: 0.78rem;
      text-decoration: none;
      font-weight: 700;
    }
    
    .btn { 
      width: 100%; 
      background: var(--accent-gold-gradient); 
      color: #000; 
      border: none; 
      padding: 12px; 
      border-radius: 10px; 
      font-weight: 800; 
      font-size: 0.92rem; 
      cursor: pointer; 
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .status-msg { text-align: center; font-size: 0.82rem; margin-top: 10px; font-weight: 700; }

    /* عناصر قائمة الحالات المنشورة */
    .item-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: rgba(0,0,0,0.3); 
      padding: 10px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      border: 1px solid rgba(255,255,255,0.05); 
    }
    .item-thumb { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; }
    .item-info { flex: 1; margin: 0 12px; }
    .item-date { font-size: 0.75rem; color: var(--text-muted); }
    .btn-del { 
      background: #ef4444; 
      color: #fff; 
      border: none; 
      padding: 7px 12px; 
      border-radius: 8px; 
      font-size: 0.78rem; 
      font-weight: 700; 
      cursor: pointer; 
    }

    #adminSection { display: none; }
  </style>
</head>
<body>

  <div class="container">

    <!-- قفل الأمان السري للدخول -->
    <div id="loginSection" class="card">
      <h1>🔐 دخول لوحة الإدارة</h1>
      <p class="desc">الرجاء إدخال الرمز السري للمتابعة</p>
      <input type="password" id="pinInput" placeholder="أدخل الرمز السري" pattern="[0-9]*" inputmode="numeric">
      <button class="btn" onclick="checkLogin()">دخول</button>
      <div id="loginMsg" class="status-msg"></div>
    </div>

    <!-- لوحة الإدارة بعد الدخول -->
    <div id="adminSection">
      <div class="card">
        <h1>إضافة حالة جديدة</h1>
        <p class="desc">ضع رابط الصورة المباشر لنشرها فوراً في الموقع</p>
        
        <label>رابط الصورة المباشر:</label>
        <input type="text" id="imgUrlInput" placeholder="https://i.postimg.cc/... أو https://i.ibb.co/...">
        
        <a href="https://postimages.org/" target="_blank" class="help-link">
          🌐 اضغط هنا لرفع الصورة ونسخ الرابط المباشر بسهولة
        </a>

        <button class="btn" id="saveBtn" onclick="saveCase()">نشر الحالة في الموقع ✨</button>
        <div id="statusMsg" class="status-msg"></div>
      </div>

      <!-- قائمة الحالات الحالية وإدارتها -->
      <div class="card">
        <h2 style="font-size:1.02rem; color:#fff; margin-bottom:12px; font-weight:800;">الحالات المنشورة حالياً في المعرض</h2>
        <div id="casesList">جارٍ التحميل...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://cwbmifhlpykpiwizqvnb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xHeBRRg1HtIYJvd_L1WGZw_Jvmoir9d";
    const ADMIN_PIN = "1234";

    function checkLogin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === ADMIN_PIN) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';
        loadCases();
      } else {
        document.getElementById('loginMsg').innerText = "رمز المرور غير صحيح!";
        document.getElementById('loginMsg').style.color = "#ef4444";
      }
    }

    async function loadCases() {
      const container = document.getElementById('casesList');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/cases?select=*&order=id.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        const data = await res.json();
        
        if (!data || data.length === 0) {
          container.innerHTML = "<p style='font-size:0.8rem; color:#94a3b8; text-align:center;'>لا توجد حالات منشورة حالياً.</p>";
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="item-row">
            <img src="${item.image_url}" class="item-thumb" alt="">
            <div class="item-info">
              <div class="item-date">حالة رقم #${item.id}</div>
            </div>
            <button class="btn-del" onclick="deleteCase(${item.id})">حذف</button>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = "<p style='color:#ef4444; font-size:0.8rem;'>تعذر تحميل الحالات.</p>";
      }
    }

    async function saveCase() {
      const urlInput = document.getElementById('imgUrlInput');
      const imageUrl = urlInput.value.trim();
      const msg = document.getElementById('statusMsg');
      const btn = document.getElementById('saveBtn');

      if (!imageUrl) {
        msg.innerText = "يرجى وضع رابط الصورة أولاً!";
        msg.style.color = "#ef4444";
        return;
      }

      btn.disabled = true;
      msg.innerText = "جارٍ حفظ الحالة ونشرها...";
      msg.style.color = "#fbbf24";

      try {
        const supaRes = await fetch(`${SUPABASE_URL}/rest/v1/cases`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({
            image_url: imageUrl
          })
        });

        if (supaRes.ok) {
          msg.innerText = "تم نشر الحالة في المعرض بنجاح! ✨";
          msg.style.color = "#10b981";
          urlInput.value = "";
          loadCases();
        } else {
          throw new Error("فشل حفظ البيانات");
        }
      } catch (err) {
        msg.innerText = "حدث خطأ أثناء الحفظ، تأكد من صحة الرابط.";
        msg.style.color = "#ef4444";
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteCase(id) {
      if (!confirm("هل أنت متأكد من رغبتك بحذف هذه الحالة من الموقع؟")) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/cases?id=eq.${id}`, {
          method: "DELETE",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        loadCases();
      } catch (err) {
        alert("تعذر حذف الحالة.");
      }
    }
  </script>
</body>
</html>
