<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | عيادة د. رامي الحسين</title>
  <style>
    :root {
      --bg-dark: #070e1b;
      --card-bg: #0f1d33;
      --accent-gold: #f59e0b;
      --accent-gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding: 24px 14px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    .card { 
      background: var(--card-bg); 
      border: 1px solid rgba(255,255,255,0.08); 
      border-radius: var(--radius); 
      padding: 20px; 
      margin-bottom: 16px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    h1 { font-size: 1.35rem; color: var(--accent-gold); margin-bottom: 6px; text-align: center; font-weight: 800; }
    p.desc { font-size: 0.82rem; color: var(--text-muted); text-align: center; margin-bottom: 18px; }
    
    label { display: block; font-size: 0.85rem; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }
    
    input[type="password"] {
      width: 100%; 
      background: #070e1b; 
      border: 1px solid rgba(255,255,255,0.15); 
      color: #fff; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 0.95rem; 
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: 3px;
    }

    /* منطقة رفع الصورة مباشرة من الهاتف */
    .upload-dropzone {
      border: 2px dashed rgba(245, 158, 11, 0.45);
      background: rgba(7, 14, 27, 0.7);
      border-radius: 12px;
      padding: 22px 14px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.25s ease;
    }

    .upload-dropzone:hover {
      border-color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.05);
    }

    .upload-icon {
      font-size: 2rem;
      color: var(--accent-gold);
      display: block;
      margin-bottom: 6px;
    }

    .upload-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .upload-sub {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #fileInput {
      display: none;
    }

    /* معاينة الصورة المختارة */
    .preview-box {
      display: none;
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1.5px solid var(--accent-gold);
      background: #000;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-remove-preview {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(239, 68, 68, 0.88);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    
    .btn { 
      width: 100%; 
      background: var(--accent-gold-gradient); 
      color: #000; 
      border: none; 
      padding: 12px; 
      border-radius: 10px; 
      font-weight: 800; 
      font-size: 0.92rem; 
      cursor: pointer; 
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .status-msg { text-align: center; font-size: 0.82rem; margin-top: 10px; font-weight: 700; }

    /* قائمة الحالات المنشورة */
    .item-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: rgba(0,0,0,0.3); 
      padding: 10px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      border: 1px solid rgba(255,255,255,0.05); 
    }
    .item-thumb { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; }
    .item-info { flex: 1; margin: 0 12px; }
    .item-date { font-size: 0.75rem; color: var(--text-muted); }
    .btn-del { 
      background: #ef4444; 
      color: #fff; 
      border: none; 
      padding: 7px 12px; 
      border-radius: 8px; 
      font-size: 0.78rem; 
      font-weight: 700; 
      cursor: pointer; 
    }

    #adminSection { display: none; }
  </style>

  <!-- مكتبات Firebase الأساسية -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="container">

    <!-- قفل الأمان السري 1234 -->
    <div id="loginSection" class="card">
      <h1>🔐 دخول لوحة الإدارة</h1>
      <p class="desc">الرجاء إدخال الرمز السري للمتابعة</p>
      <input type="password" id="pinInput" placeholder="أدخل الرمز السري" pattern="[0-9]*" inputmode="numeric">
      <button class="btn" onclick="checkLogin()">دخول</button>
      <div id="loginMsg" class="status-msg"></div>
    </div>

    <!-- لوحة الإدارة بعد الدخول -->
    <div id="adminSection">
      <div class="card">
        <h1>إضافة حالة جديدة</h1>
        <p class="desc">اختر الصورة مباشرة من الهاتف لنشرها فوراً في الموقع</p>
        
        <label>صورة الحالة الطبية:</label>
        
        <!-- حقل رفع مباشر من استوديو الهاتف -->
        <div class="upload-dropzone" onclick="document.getElementById('fileInput').click()">
          <span class="upload-icon">📁</span>
          <div class="upload-text">اضغط هنا لاختيار صورة من ألبوم الصور</div>
          <div class="upload-sub">تُعالج الصورة وتُنشر مباشرة في المعرض</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">

        <!-- معاينة مصغرة -->
        <div class="preview-box" id="previewContainer">
          <img id="previewImg" src="" alt="معاينة">
          <button class="btn-remove-preview" onclick="cancelPreview()">إلغاء الصورة</button>
        </div>

        <button class="btn" id="saveBtn" onclick="uploadAndPublishCase()">نشر الحالة في الموقع ✨</button>
        <div id="statusMsg" class="status-msg"></div>
      </div>

      <!-- قائمة الحالات المنشورة حالياً مع إمكانية الحذف -->
      <div class="card">
        <h2 style="font-size:1.02rem; color:#fff; margin-bottom:12px; font-weight:800;">الحالات المنشورة حالياً في المعرض</h2>
        <div id="casesList">جارٍ التحميل...</div>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PIN = "1234";

    // إعدادات Firebase الخاصة بالعيادة
    const firebaseConfig = {
      apiKey: "AIzaSyAb5POlSchsrQdO0oi6yz7oxdZuyzr_RiA",
      authDomain: "dr-rami-58ca5.firebaseapp.com",
      projectId: "dr-rami-58ca5",
      storageBucket: "dr-rami-58ca5.firebasestorage.app",
      messagingSenderId: "806864430844",
      appId: "1:806864430844:web:639105b9856e83268fd979"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let processedImageBase64 = null;

    function checkLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin === ADMIN_PIN) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';
        listenToAdminCases();
      } else {
        document.getElementById('loginMsg').innerText = "رمز المرور غير صحيح!";
        document.getElementById('loginMsg').style.color = "#ef4444";
      }
    }

    // ضغط الصورة تلقائياً لتكون خفيفة وسريعة وتخزينها مباشرة دون أي سيرفر خارجي
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 900;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          // تحويل الصورة لصيغة خفيفة ومضغوطة
          processedImageBase64 = canvas.toDataURL("image/jpeg", 0.75);

          document.getElementById('previewImg').src = processedImageBase64;
          document.getElementById('previewContainer').style.display = 'block';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function cancelPreview() {
      processedImageBase64 = null;
      document.getElementById('fileInput').value = "";
      document.getElementById('previewContainer').style.display = 'none';
    }

    // عرض الحالات الحالية مباشرة من Firestore
    function listenToAdminCases() {
      const container = document.getElementById('casesList');

      db.collection("cases").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        if (snapshot.empty) {
          container.innerHTML = "<p style='font-size:0.8rem; color:#94a3b8; text-align:center;'>لا توجد حالات منشورة حالياً.</p>";
          return;
        }

        container.innerHTML = snapshot.docs.map(doc => {
          const item = doc.data();
          return `
            <div class="item-row">
              <img src="${item.image_url}" class="item-thumb" alt="حالة">
              <div class="item-info">
                <div class="item-date">حالة طبية معتمدة</div>
              </div>
              <button class="btn-del" onclick="deleteCase('${doc.id}')">حذف</button>
            </div>
          `;
        }).join('');
      }, (error) => {
        container.innerHTML = "<p style='color:#ef4444; font-size:0.8rem; text-align:center;'>خطأ في جلب الحالات: " + error.message + "</p>";
      });
    }

    // نشر الحالة مباشرة إلى Firestore بدون وسيط
    async function uploadAndPublishCase() {
      const msg = document.getElementById('statusMsg');
      const btn = document.getElementById('saveBtn');

      if (!processedImageBase64) {
        msg.innerText = "يرجى اختيار صورة من الألبوم أولاً!";
        msg.style.color = "#ef4444";
        return;
      }

      btn.disabled = true;
      msg.innerText = "جارٍ حفظ ونشر الحالة في المعرض...";
      msg.style.color = "#fbbf24";

      try {
        await db.collection("cases").add({
          image_url: processedImageBase64,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        msg.innerText = "تم نشر الحالة بنجاح في المعرض! ✨";
        msg.style.color = "#10b981";
        cancelPreview();
      } catch (err) {
        console.error(err);
        msg.innerText = "تعذر الحفظ: " + (err.message || err);
        msg.style.color = "#ef4444";
      } finally {
        btn.disabled = false;
      }
    }

    // حذف حالة
    async function deleteCase(docId) {
      if (!confirm("هل أنت متأكد من رغبتك بحذف هذه الحالة من الموقع؟")) return;
      try {
        await db.collection("cases").doc(docId).delete();
      } catch (err) {
        alert("تعذر حذف الحالة: " + err.message);
      }
    }
  </script>
</body>
</html>
